<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบเช็กสถานะการจ่ายเงิน</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:#f5f8fb;color:#172235}
button,input{font:inherit}.app{display:flex;min-height:100vh}.sidebar{width:230px;background:#17283d;color:#fff;padding:24px 14px;display:flex;flex-direction:column}.brand{font-size:19px;font-weight:700;line-height:1.35;padding:8px 10px 30px}.nav button{width:100%;border:0;background:none;color:#d9e2ed;text-align:left;padding:14px 15px;border-radius:14px;margin:4px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#126e73;color:#fff}.admin{margin-top:auto;padding:14px;color:#d9e2ed}.main{flex:1;padding:34px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.title{font-size:32px;font-weight:800;margin:0}.subtitle{margin:7px 0 25px;color:#68778b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{padding:24px;border-radius:22px;background:#fff;border:1px solid #e7edf4;box-shadow:0 8px 25px #1c2d3b0d}.card.blue{background:#edf5ff}.card.green{background:#eefaf4}.card.red{background:#fff0f0}.label{font-weight:700;margin-bottom:8px}.value{font-size:31px;font-weight:800}.green .value{color:#087443}.red .value{color:#c72a2a}.toolbar{display:flex;gap:10px;align-items:center;margin:28px 0 14px;flex-wrap:wrap}.tabs{display:flex;gap:8px}.tab{border:0;padding:12px 20px;border-radius:24px;background:#e9f0f5;cursor:pointer}.tab.active{background:#117c82;color:#fff}.add{margin-left:auto;border:0;background:#087f69;color:#fff;padding:13px 20px;border-radius:14px;font-weight:700;cursor:pointer}.search{width:100%;padding:15px 18px;border:1px solid #dbe4ee;border-radius:15px;background:#fff;outline:none;margin-bottom:16px}.tablewrap{background:#fff;border:1px solid #e4ebf2;border-radius:20px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:820px}.table th,.table td{padding:16px;border-bottom:1px solid #edf1f5;text-align:left}.table th{background:#f5f8fb;color:#536274;font-size:14px}.badge{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:20px;font-size:13px;font-weight:700}.paid{background:#e8f8ef;color:#087443}.unpaid{background:#fff0f0;color:#c72a2a}.actions button{border:0;background:#f0f3f6;padding:7px 9px;border-radius:8px;cursor:pointer;margin-right:4px}.empty{text-align:center;padding:55px;color:#718096}.modal{display:none;position:fixed;inset:0;background:#17283d66;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.show{display:flex}.modalbox{width:min(480px,100%);background:#fff;border-radius:22px;padding:25px}.modalbox h2{margin-top:0}.field{margin:13px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #d8e1ea;border-radius:10px}.modalactions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.cancel,.save{padding:11px 18px;border:0;border-radius:10px;cursor:pointer}.cancel{background:#edf1f5}.save{background:#087f69;color:white}.notice{position:fixed;right:20px;bottom:20px;background:#17283d;color:white;padding:13px 17px;border-radius:12px;display:none}
@media(max-width:800px){.sidebar{display:none}.main{padding:20px}.stats{grid-template-columns:1fr}.title{font-size:26px}.add{margin-left:0}.toolbar{align-items:stretch}.tabs{overflow:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">💰 ระบบเช็ก<br>สถานะการจ่ายเงิน</div>
  <div class="nav">
    <button class="active">⌂ &nbsp; หน้าหลัก</button>
    <button>👥 &nbsp; รายชื่อทั้งหมด</button>
    <button>▥ &nbsp; สรุปยอด</button>
    <button>⚙ &nbsp; ตั้งค่า</button>
  </div>
  <div class="admin">👤 &nbsp; ผู้ดูแลระบบ</div>
</aside>
<main class="main">
  <div class="top"><div>
    <h1 class="title">💰 เช็กสถานะการจ่ายเงิน</h1>
    <p class="subtitle">ติดตามว่าใครจ่ายแล้ว และใครยังไม่ได้จ่าย</p>
  </div></div>

  <section class="stats">
    <div class="card blue"><div class="label">👥 คนทั้งหมด</div><div class="value" id="totalPeople">0 คน</div></div>
    <div class="card green"><div class="label">🟢 จ่ายแล้ว</div><div class="value" id="paidTotal">0 บาท</div></div>
    <div class="card red"><div class="label">🔴 ค้างจ่าย</div><div class="value" id="unpaidTotal">0 บาท</div></div>
  </section>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab active" data-filter="all">ทั้งหมด</button>
      <button class="tab" data-filter="paid">🟢 จ่ายแล้ว</button>
      <button class="tab" data-filter="unpaid">🔴 ยังไม่จ่าย</button>
    </div>
    <button class="add" id="addBtn">＋ เพิ่มรายชื่อ</button>
  </div>

  <input class="search" id="search" placeholder="🔍 ค้นหาชื่อ - นามสกุล">

  <div class="tablewrap">
    <table class="table">
      <thead><tr><th>#</th><th>ชื่อ - นามสกุล</th><th>จำนวนเงิน</th><th>สถานะ</th><th>วันที่จ่าย</th><th>หมายเหตุ</th><th>จัดการ</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty">ยังไม่มีรายชื่อ กด “＋ เพิ่มรายชื่อ” เพื่อเริ่มต้น</div>
  </div>
</main>
</div>

<div class="modal" id="modal">
  <div class="modalbox">
    <h2 id="modalTitle">เพิ่มรายชื่อ</h2>
    <div class="field"><label>ชื่อ - นามสกุล</label><input id="name" placeholder="เช่น นายสมชาย ใจดี"></div>
    <div class="field"><label>จำนวนเงิน (บาท)</label><input id="amount" type="number" min="0" placeholder="500"></div>
    <div class="field"><label>สถานะ</label><select id="status"><option value="unpaid">🔴 ยังไม่จ่าย</option><option value="paid">🟢 จ่ายแล้ว</option></select></div>
    <div class="field"><label>วันที่จ่าย</label><input id="date" type="date"></div>
    <div class="field"><label>หมายเหตุ</label><input id="note" placeholder="เช่น โอนแล้ว"></div>
    <div class="modalactions"><button class="cancel" id="cancel">ยกเลิก</button><button class="save" id="save">บันทึก</button></div>
  </div>
</div>
<div class="notice" id="notice"></div>

<script>
const KEY="paymentTrackerData";
let data=JSON.parse(localStorage.getItem(KEY)||"[]");
let filter="all", editIndex=null;

const $=id=>document.getElementById(id);
function money(n){return Number(n||0).toLocaleString("th-TH")+" บาท"}
function saveData(){localStorage.setItem(KEY,JSON.stringify(data))}
function notify(t){$("notice").textContent=t;$("notice").style.display="block";setTimeout(()=>$("notice").style.display="none",1600)}
function render(){
  const q=$("search").value.trim().toLowerCase();
  const paid=data.filter(x=>x.status==="paid");
  const unpaid=data.filter(x=>x.status==="unpaid");
  $("totalPeople").textContent=data.length.toLocaleString("th-TH")+" คน";
  $("paidTotal").textContent=money(paid.reduce((s,x)=>s+Number(x.amount||0),0));
  $("unpaidTotal").textContent=money(unpaid.reduce((s,x)=>s+Number(x.amount||0),0));
  let rows=data.map((x,i)=>({...x,i})).filter(x=>
    (filter==="all"||x.status===filter) &&
    x.name.toLowerCase().includes(q)
  );
  $("tbody").innerHTML=rows.map((x,n)=>`<tr>
    <td>${n+1}</td><td><b>${escapeHtml(x.name)}</b></td><td>${money(x.amount)}</td>
    <td><span class="badge ${x.status==="paid"?"paid":"unpaid"}">${x.status==="paid"?"✓ จ่ายแล้ว":"× ยังไม่จ่าย"}</span></td>
    <td>${x.date||"-"}</td><td>${escapeHtml(x.note||"-")}</td>
    <td class="actions"><button onclick="editItem(${x.i})">✏️</button><button onclick="toggleItem(${x.i})">${x.status==="paid"?"🔴":"🟢"}</button><button onclick="deleteItem(${x.i})">🗑️</button></td>
  </tr>`).join("");
  $("empty").style.display=rows.length?"none":"block";
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function openModal(i=null){
  editIndex=i;$("modalTitle").textContent=i===null?"เพิ่มรายชื่อ":"แก้ไขรายชื่อ";
  const x=i===null?{name:"",amount:"",status:"unpaid",date:"",note:""}:data[i];
  $("name").value=x.name;$("amount").value=x.amount;$("status").value=x.status;$("date").value=x.date||"";$("note").value=x.note||"";
  $("modal").classList.add("show");$("name").focus();
}
function closeModal(){$("modal").classList.remove("show")}
$("addBtn").onclick=()=>openModal();
$("cancel").onclick=closeModal;
$("save").onclick=()=>{
  const name=$("name").value.trim(), amount=Number($("amount").value);
  if(!name){alert("กรุณากรอกชื่อ - นามสกุล");return}
  if(amount<0||Number.isNaN(amount)){alert("กรุณากรอกจำนวนเงิน");return}
  const obj={name,amount,status:$("status").value,date:$("date").value,note:$("note").value.trim()};
  if(editIndex===null)data.push(obj);else data[editIndex]=obj;
  saveData();render();closeModal();notify(editIndex===null?"เพิ่มรายชื่อแล้ว":"บันทึกการแก้ไขแล้ว");
}
window.editItem=i=>openModal(i);
window.toggleItem=i=>{data[i].status=data[i].status==="paid"?"unpaid":"paid";if(data[i].status==="paid"&&!data[i].date)data[i].date=new Date().toISOString().slice(0,10);saveData();render();notify("อัปเดตสถานะแล้ว")};
window.deleteItem=i=>{if(confirm(`ต้องการลบ "${data[i].name}" หรือไม่?`)){data.splice(i,1);saveData();render();notify("ลบรายชื่อแล้ว")}};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;render()});
$("search").oninput=render;
render();
</script>
</body>
</html>
